matrix:
  - name: Markdown
    aspell:
      lang: en
    dictionary:
      wordlists:
        - .wordlist.txt
      output: wordlist.dic
      encoding: utf-8
    pipeline:
      - pyspelling.filters.markdown:
      - pyspelling.filters.html:
          comments: false
          ignores:
            - code
            - pre
            # Uploaded media (the README demo video) has a random id that is not words.
            - 'a[href^="https://github.com/user-attachments/"]'
    sources:
      - '**/*.md|!node_modules/**|!dist/**'
    default_encoding: utf-8
