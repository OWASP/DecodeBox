name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'From main, rebuild the HTML for an existing release (vX.Y.Z). Leave blank for Release Please.'
        required: false
        type: string

      repair_release_notes_tag:
        description: 'From main, repair the notes of an existing release with a verified standalone asset.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Manage release and standalone HTML
    if: github.ref == 'refs/heads/main' && inputs.release_tag == '' && inputs.repair_release_notes_tag == ''
    runs-on: ubuntu-24.04
    env:
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: bash

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Prepare the pinned Release Please library
        uses: ./.github/actions/release-please-tools

      # The pinned action skips labeling new PRs, but requires its pending label
      # to update an open PR or publish a merged one. Reconcile its own root PR.
      - name: Recognize the pending Release Please PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh api --method GET "repos/$GH_REPO/pulls" -f base=main -f state=all \
            -f "head=${GH_REPO%/*}:release-please--branches--main--components--owasp-decodebox" \
            -f sort=created -f direction=desc -F per_page=1 --jq '
              .[] | select(.user.login == "github-actions[bot]")
              | select(.state == "open" or (.merged_at and (.title | startswith("chore(release): OWASP DecodeBox v"))))
              | select(all(.labels[]; .name | startswith("autorelease:") | not))
              | .number')
          if [[ -n "$pr" ]]; then
            gh api --method POST "repos/$GH_REPO/issues/$pr/labels" -F 'labels[]=autorelease: pending' |
              jq -e 'any(.[]; .name == "autorelease: pending")'
          fi

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-labeling: true
          skip-github-pull-request: true

      - name: Record the original release title and notes
        id: baseline
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          ORIGINAL_TITLE: ${{ steps.release.outputs.name }}
          ORIGINAL_NOTES: ${{ steps.release.outputs.body }}
        run: node .github/scripts/publish-release-notes.cjs baseline

      - name: Build, upload and verify the standalone HTML
        id: standalone
        if: success() && steps.baseline.outcome == 'success'
        uses: ./.github/actions/standalone-release
        with:
          tag: ${{ steps.release.outputs.tag_name }}

      - name: Format the newly created GitHub Release
        if: >-
          success() && steps.release.outputs.release_created == 'true' && steps.baseline.outcome == 'success' &&
          steps.standalone.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          VERIFIED_DIGEST: ${{ steps.standalone.outputs.digest }}
        run: node .github/scripts/publish-release-notes.cjs format

      - name: Create or update the Release Please PR
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_PATH: ${{ runner.temp }}/release-please/node_modules
        run: node .github/scripts/release-notes.cjs

  maintenance:
    name: Repair a published release
    if: github.ref == 'refs/heads/main' && (inputs.release_tag != '' || inputs.repair_release_notes_tag != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Reject conflicting repair requests
        if: inputs.release_tag != '' && inputs.repair_release_notes_tag != ''
        run: |
          echo "::error::Choose either release_tag or repair_release_notes_tag, never both."
          exit 1

      - name: Check out release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Rebuild the standalone HTML
        if: inputs.release_tag != '' && inputs.repair_release_notes_tag == ''
        uses: ./.github/actions/standalone-release
        with:
          tag: ${{ inputs.release_tag }}

      - name: Recover release notes
        if: inputs.repair_release_notes_tag != '' && inputs.release_tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.repair_release_notes_tag }}
        run: node .github/scripts/publish-release-notes.cjs repair
