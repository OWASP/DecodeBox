name: CI

# Actions are pinned to commit SHAs rather than tags. A tag is mutable: whoever
# controls the action repository can repoint it at different code. Dependabot is
# configured to bump these pins, so the maintenance cost is a review, not a chore.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use project Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install clean packages
        run: npm clean-install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test -- --run

      - name: Build
        run: npm run build

      - name: Verify SDK distribution
        run: npm run check:sdk-dist

      - name: Load the classic and module distributions in Chrome
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist >/dev/null 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          node scripts/check-sdk-browser.mjs http://127.0.0.1:8765/

      - name: Exercise the Java runtime provider
        run: |
          archive="$RUNNER_TEMP/graaljs.tar.gz"
          release=https://github.com/oracle/graaljs/releases/download/graal-25.0.1
          curl -fsSL "$release/graaljs-community-jvm-25.0.1-linux-amd64.tar.gz" -o "$archive"
          echo "7dfa228b2e9af3ad4fad77635aa105d55a31838ba522200772131db7d4560af5  $archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/graaljs"
          tar -xzf "$archive" --strip-components=1 -C "$RUNNER_TEMP/graaljs"
          "$RUNNER_TEMP/graaljs/bin/js" -e '
            load("dist/api.js");
            if (DecodeBox.capabilities().runtime !== "graaljs-java") throw Error("Java provider missing");
            DecodeBox.executeOperation("sha-256", "abc").then(print);
          ' | grep -Fx ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad

      - name: Report bundle size
        run: |
          {
            echo "### Bundle size"
            echo '```'
            du -sh dist
            find dist -name '*.js' -exec sh -c 'printf "%s bytes gzipped  %s\n" "$(gzip -c "$1" | wc -c)" "$1"' _ {} \; \
              | sort -rn | head -10
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist
          retention-days: 7

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Blocks a pull request that introduces a known-vulnerable dependency or a
      # license incompatible with Apache-2.0 redistribution.
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-2.0, GPL-3.0, LGPL-2.1, LGPL-3.0, SSPL-1.0
          comment-summary-in-pr: on-failure

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install clean packages
        run: npm clean-install

      # Fails on high and critical advisories only. Moderate and below are
      # reported but do not block, to keep the signal actionable.
      - name: Audit
        run: npm audit --audit-level=high
